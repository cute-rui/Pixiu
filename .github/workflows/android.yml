name: android

on:
  push:
  pull_request:

jobs:
  debug:
    name: debug apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
      - uses: android-actions/setup-android@v3
      - name: install ndk
        run: sdkmanager --install "ndk;23.1.7779620" "platforms;android-34" "build-tools;34.0.0"
      - name: bind and assemble
        working-directory: android-client
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          chmod +x ./gradlew ./build-android-lib.sh
          ./build-android-lib.sh
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pixiu-android-debug
          path: android-client/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
