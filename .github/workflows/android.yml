name: android

# Pushes to main are built by prerelease.yml so each commit is packaged once.
# Pull requests, other branches, and manual runs still build and upload the APK.
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: write

jobs:
  debug:
    name: debug apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache-dependency-path: netbird/go.sum
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: install ndk
        run: sdkmanager --install "ndk;23.1.7779620" "platforms;android-34" "build-tools;34.0.0"
      - name: bind
        working-directory: android-client
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          chmod +x ./gradlew ./build-android-lib.sh
          ./build-android-lib.sh
      - name: assemble
        working-directory: android-client
        run: ./gradlew assembleDebug
      - name: stage apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          count=0
          for apk in android-client/app/build/outputs/apk/debug/*.apk; do
            if [ ! -f "$apk" ]; then
              echo "debug apk not found" >&2
              exit 1
            fi
            count=$((count + 1))
            cp "$apk" dist/pixiu-android.apk
          done
          if [ "$count" -ne 1 ]; then
            echo "expected one debug apk, found $count" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pixiu-android-apk
          path: dist/pixiu-android.apk
          if-no-files-found: error
          compression-level: 0
